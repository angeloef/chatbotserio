<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatbotSerio — Simulador WhatsApp</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #e5ddd5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.phone { width: 420px; max-width: 100vw; height: 95vh; background: #efeae2; border-radius: 12px; box-shadow: 0 4px 30px rgba(0,0,0,.15); display: flex; flex-direction: column; overflow: hidden; }

/* Header */
.header { background: #075e54; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.header .avatar { background: #25d366; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.header .info h3 { font-size: 15px; font-weight: 600; }
.header .info span { font-size: 12px; opacity: .8; display: flex; align-items: center; gap: 4px; }
.header .info span::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #25d366; border-radius: 50%; }

/* Messages */
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.45; word-wrap: break-word; position: relative; }
.msg.user { align-self: flex-end; background: #dcf8c6; border-radius: 8px 0 8px 8px; }
.msg.bot { align-self: flex-start; background: #fff; border-radius: 0 8px 8px 8px; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.msg .time { font-size: 11px; color: #999; margin-top: 4px; text-align: right; }
.msg .meta { font-size: 10px; color: #aaa; }

/* Input */
.input-area { background: #f0f0f0; padding: 12px; display: flex; gap: 8px; align-items: center; }
.input-area input { flex: 1; padding: 10px 14px; border: none; border-radius: 24px; font-size: 14px; outline: none; background: #fff; }
.input-area button { background: #075e54; color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background .2s; }
.input-area button:hover { background: #0a6e62; }

/* Quick actions */
.quick-actions { padding: 4px 16px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.quick-actions button { padding: 5px 12px; border: 1px solid #ddd; border-radius: 16px; background: #fff; font-size: 12px; cursor: pointer; color: #075e54; transition: background .15s; }
.quick-actions button:hover { background: #dcf8c6; }

/* Loading */
.loading { align-self: flex-start; background: #fff; padding: 12px; border-radius: 8px; display: flex; gap: 6px; }
.loading span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
.loading span:nth-child(2) { animation-delay: .2s; }
.loading span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

/* Settings bar */
.settings { background: #f0f0f0; padding: 8px 16px; display: flex; gap: 10px; align-items: center; font-size: 11px; color: #666; border-top: 1px solid #ddd; }
.settings input { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 11px; width: 100px; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="avatar">🏠</div>
    <div class="info">
      <h3>ChatbotSerio</h3>
      <span>en línea</span>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">
      ¡Hola! Soy ChatbotSerio, tu asistente inmobiliario en Oberá.
      <br>Podés preguntarme por alquileres, ventas, requisitos, zonas y más.
      <div class="time">ahora</div>
    </div>
  </div>

  <div class="quick-actions">
    <button onclick="sendMsg('busco depto alquiler Centro hasta 90 lucas')">🔍 Depto Centro</button>
    <button onclick="sendMsg('qué necesito para alquilar')">📋 Requisitos</button>
    <button onclick="sendMsg('qué zonas hay')">📍 Zonas</button>
    <button onclick="sendMsg('mostrame fotos del 1')">📸 Fotos</button>
    <button onclick="sendMsg('es muy caro')">💰 Muy caro</button>
    <button onclick="sendMsg('agendame para ver el depto 3')">📅 Agendar</button>
  </div>

  <div class="input-area">
    <input id="msgInput" placeholder="Escribí un mensaje..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()">➤</button>
  </div>

  <div class="settings">
    <label>📱 Tel:</label>
    <input id="phoneInput" value="5491155550001">
    <label>🆔 Sesión:</label>
    <input id="sessionInput" value="chat-ui">
    <button onclick="newSession()" style="padding:3px 8px;font-size:11px;cursor:pointer">Nueva</button>
    <span id="stats" style="margin-left:auto"></span>
  </div>
</div>

<script>
const API = '/chat';
let turnCount = 0;
let totalLatency = 0;

function newSession() {
  document.getElementById('sessionInput').value = 'chat-ui-' + Date.now();
  document.getElementById('messages').innerHTML = '';
  turnCount = 0;
  totalLatency = 0;
  updateStats();
}

function getTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function addMsg(text, who, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = text.replace(/\n/g, '<br>');
  const timeDiv = document.createElement('div');
  timeDiv.className = 'time';
  timeDiv.textContent = getTime();
  div.appendChild(timeDiv);
  if (meta) {
    const metaDiv = document.createElement('div');
    metaDiv.className = 'meta';
    metaDiv.textContent = meta;
    div.appendChild(metaDiv);
  }
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function addLoading() {
  const div = document.createElement('div');
  div.className = 'loading';
  div.id = 'loading-indicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function removeLoading() {
  const el = document.getElementById('loading-indicator');
  if (el) el.remove();
}

function updateStats() {
  const avg = turnCount > 0 ? (totalLatency / turnCount).toFixed(0) : 0;
  document.getElementById('stats').textContent = `T${turnCount} | ~${avg}ms`;
}

async function sendMsg(text) {
  const input = document.getElementById('msgInput');
  const message = text || input.value.trim();
  if (!message) return;
  if (!text) input.value = '';

  addMsg(message, 'user');
  addLoading();

  const phone = document.getElementById('phoneInput').value;
  const session = document.getElementById('sessionInput').value;

  const t0 = performance.now();
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: session, phone })
    });
    const data = await res.json();
    removeLoading();

    const latency = (performance.now() - t0).toFixed(0);
    turnCount++;
    totalLatency += parseFloat(latency);
    updateStats();

    const meta = data.tools_called?.length
      ? `🛠 ${data.tools_called.join(', ')} | conf:${data.confidence?.toFixed(2)} | ${latency}ms`
      : `conf:${data.confidence?.toFixed(2)} | ${latency}ms`;

    // Handle multi-message responses (sequential tool results first, then closing)
    if (data.messages && data.messages.length > 0) {
        for (let i = 0; i < data.messages.length; i++) {
            const chunk = data.messages[i];
            setTimeout(() => {
                const chunkMeta = chunk.tool_used
                    ? `🛠 ${chunk.tool_used}`
                    : '';
                addMsg(chunk.text, 'bot', chunkMeta);
            }, (i + 1) * 800);  // 800ms stagger for natural feel
        }
        // Show closing response after all tool chunks
        const totalDelay = (data.messages.length + 1) * 800;
        setTimeout(() => {
            addMsg(data.response, 'bot', meta);
        }, totalDelay);
    } else {
        addMsg(data.response, 'bot', meta);
    }
  } catch (e) {
    removeLoading();
    addMsg('❌ Error de conexión. ¿Está corriendo Docker?', 'bot');
  }
}
</script>
</body>
</html>
